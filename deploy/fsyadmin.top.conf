# TLS certificates are managed by the server's existing certificate configuration.
# Include the matching HTTPS server block from your hosting panel; do not replace it.
server {
    listen 80;
    server_name fsyadmin.top;
    root /www/wwwroot/default/dist;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
